services:
  postgres:
    image: postgres:16
    container_name: spider-xhs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spider_xhs
      POSTGRES_USER: spider_xhs
      POSTGRES_PASSWORD: spider_xhs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider_xhs -d spider_xhs"]
      interval: 5s
      timeout: 5s
      retries: 12

  xhs-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_CHINA_MIRRORS: ${ENABLE_CHINA_MIRRORS:-1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: spider-xhs-web:local
    container_name: spider-xhs-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      XHS_WEB_HOST: 0.0.0.0
      XHS_WEB_PORT: 8000
      XHS_USE_PROXY: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: spider_xhs
      POSTGRES_USER: spider_xhs
      POSTGRES_PASSWORD: spider_xhs
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./datas:/app/datas

volumes:
  postgres-data:
